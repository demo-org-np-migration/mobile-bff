{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mobile-bff
  labels:
    {{- include "mobile-bff.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mobile-bff.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
